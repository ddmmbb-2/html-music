<main><div class="library-head"><div><p class="eyebrow" style="margin:0">LIBRARY</p><h2 id="heading">所有音樂</h2><div class="muted" id="summary">0 首音樂</div></div><div class="search"><input id="search" type="search" placeholder="搜尋音樂名稱或分類…" aria-label="搜尋音樂"></div></div><div id="dropzone" class="dropzone"><div><b id="dropLabel">拖曳音樂到這裡</b><div>支援一次加入多首音樂 · 也可拖到左側分類</div></div><button id="dropAdd">＋ 選取音樂</button></div><div id="content"></div></main></div></div>

'use strict';
// SECTION 1 — library state and utilities. The template must be captured before rendering or applying user preferences.

const TEMPLATE='<!doctype html>\n'+document.documentElement.outerHTML;
const $=id=>document.getElementById(id), tracks=new Map(), collator=new Intl.Collator('zh-Hant-TW',{numeric:true,sensitivity:'base'});

function size(n){return `${(n/1024/1024).toFixed(1)} MB`}
function pathURL(path){return path.split('/').map(encodeURIComponent).join('/')}
function safePath(path){return typeof path==='string'&&path.length>0&&!path.startsWith('/')&&!path.includes('\\')&&path.split('/').every(s=>s&&s!=='.'&&s!=='..'&&!s.includes('\0'))}

function sorted(){return [...tracks.values()].sort((a,b)=>collator.compare(a.category,b.category)||collator.compare(a.name,b.name)||collator.compare(a.key,b.key))}
function catKey(c){return 'cat:'+c}
function playing(t){return t.audio&&!t.audio.paused&&!t.audio.ended}

function stop(t){t.wantPlay=false;if(t.audio){t.audio.pause();try{t.audio.currentTime=0}catch{}}updateTrack(t)}
function stopAll(resetVolume=false){cancelFade();for(const t of tracks.values())stop(t);if(resetVolume)setMaster(1);updateNow()}
function setMaster(v){master=Math.max(0,Math.min(1,v));for(const t of tracks.values())if(t.audio)t.audio.volume=master;$('volume').value=String(Math.round(master*100));$('volumeValue').textContent=Math.round(master*100)+'%'}

function startFade(target,stopAfter=false){cancelFade();const from=master,duration=Number($('fadeTime').value)*1000,start=performance.now();function tick(){const p=Math.min(1,(performance.now()-start)/duration);setMaster(from+(target-from)*p);$('fadeStatus').textContent=`${stopAfter?'淡出停止':'音量漸變'} · ${Math.round(p*100)}%`;if(p>=1){cancelFade();if(stopAfter){stopAll(true);$('fadeStatus').textContent='已全部停止，總音量重設為 100%'} }}fade={timer:setInterval(tick,30),stop:stopAfter};tick()}

function cardFor(t){if(t.ui)return t.ui.card;const card=el('article','track'),top=el('div','tracktop'),play=btn('▶','play',()=>toggle(t)),meta=el('div','meta'),title=btn(t.name,'title',()=>toggle(t)),info=el('div','fileinfo'),live=el('span','live'),timeline=el('div','timeline'),seek=el('input'),time=el('span','time','0:00 / –:––'),foot=el('div','trackfoot'),loop=btn('↻ 循環','',()=>{if(exporting)return;t.loop=!t.loop;if(t.audio)t.audio.loop=t.loop;updateTrack(t);markDirty()}),stopButton=btn('■ 停止','',()=>stop(t)),status=el('span','status');title.title=t.name;info.append(el('span','',t.name.split('.').pop().toUpperCase()),live);meta.append(title,info);top.append(play,meta);seek.type='range';seek.min='0';seek.max='1000';seek.step='1';seek.value='0';seek.setAttribute('aria-label',t.name+' 播放進度');seek.addEventListener('pointerdown',()=>{t.seeking=true});seek.addEventListener('pointercancel',()=>{t.seeking=false;updateTrack(t)});seek.addEventListener('input',()=>{const a=t.audio;if(a&&Number.isFinite(a.duration)){a.currentTime=Number(seek.value)/1000*a.duration}});seek.addEventListener('change',()=>{t.seeking=false;updateTrack(t)});seek.addEventListener('pointerup',()=>{t.seeking=false;updateTrack(t)});timeline.append(seek,time);foot.append(loop,stopButton,status);const manage=el('div','manage'),handle=el('span','draghandle','⠿'),move=el('select'),remove=btn('移除','danger',()=>removeTrack(t)),rename=btn('改名','',()=>renameTrack(t));handle.draggable=true;handle.title='拖曳移動分類';handle.addEventListener('dragstart',e=>{if(!editable()){e.preventDefault();return}e.dataTransfer.setData('application/x-music-track',t.key);e.dataTransfer.effectAllowed='move'});move.setAttribute('aria-label','移動 '+t.name+' 到分類');move.onchange=()=>moveTrack(t,move.value);manage.append(handle,move,rename,remove);card.append(top,timeline,foot,manage);card.addEventListener('pointerenter',()=>ensureAudio(t),{once:true});card.addEventListener('focusin',()=>ensureAudio(t),{once:true});t.ui={card,play,seek,time function renderNav(){const nav=$('nav'),groups=new Map([...categories].sort(collator.compare).map(c=>[c,0]));for(const t of tracks.values())groups.set(t.category,(groups.get(t.category)||0)+1);if(filter.startsWith('cat:')&&!groups.has(filter.slice(4)))filter='all';nav.replaceChildren();function add(key,name,count){const b=btn('','',()=>{filter=key;renderNav();renderContent()});b.append(el('span','',name),el('span','count',String(count)));b.classList.toggle('active',filter===key);b.setAttribute('aria-current',filter===key?'true':'false');if(key==='playing')b.dataset.playing='1';if(key.startsWith('cat:'))bindDrop(b,key.slice(4));nav.append(b)}add('all','♫ 所有音樂',tracks.size);add('playing','▶ 播放中',[...tracks.values()].filter(playing).length);for(const [name,count] of groups)add(catKey(name),name,count);$('source').textContent=`${tracks.size} 首 · ${size(totalBytes())} 原始音訊`;const hasCat=filter.startsWith('cat:')&&selectedCat()!=='未分類';$('renameCat').disabled=$('deleteCat').disabled=!hasCat;$('dropLabel').textContent='拖曳音樂到「'+selectedCat()+'」';}
function updateMove(t){const select=t.ui.move;select.replaceChildren();for(const c of [...categories].sort(collator.compare)){const o=el('option','',c===t.category?'分類：'+c:'移至 '+c);o.value=c;select.append(o)}select.value=t.category;}
function renderContent(){const content=$('content'),all=sorted(),visible=all.filter(t=>(filter==='all'||filter==='playing'&&playing(t)||filter===catKey(t.category))&&(!query||(t.name+' '+t.category).toLocaleLowerCase().includes(query)));$('heading').textContent=filter==='all'?'所有音樂':filter==='playing'?'播放中的音樂':filter.slice(4);$('summary').textContent=`${visible.length} 首音樂 · ${size(totalBytes())} 音訊總量`;content.replaceChildren();const groups=new Map();if(!query&&filter!=='playing')for(const c of [...categories].sort(collator.compare))if(filter==='all'||filter===catKey(c))groups.set(c,[]);for(const t of visible){if(!groups.has(t.category))groups.set(t.category,[]);groups.get(t.category).push(t)}if(!groups.size){const box=el('div','empty');box.append(el('div','big','♫'),el('h3','',filter==='playing'?'目前沒有符合的播放中音樂':'找不到符合的音樂'),el('p','','切換分類或清除搜尋條件。'));content.append(box);return}for(const [category,list] of groups){const sec=el('section','section'),head=el('div','sectionhead'),h=el('h3','',category),grid=el('div','grid');h.append(el('span','',list.length+' 首'));head.append(h,btn('＋ 加入音樂','',()=>chooseFiles(category)));for(const t of list){grid.append(cardFor(t));updateMove(t)}sec.append(head);if(list.length)sec.append(grid);else sec.append(el('div','compact-empty','尚無音樂 · 可直接拖曳音樂到此分類'));bindDrop(sec,category);content.append(sec)}}
function refresh(){renderNav();renderContent();updateNow()}
// SECTION 4 — library editing and import. Audio objects are retained during category moves.
function addTrack(data){if(tracks.has(data.key))return false;categories.add(data.category);tracks.set(data.key,{...data,loop:!!data.loop,audio:null,ui:null,error:'',wantPlay:false});return true}
function newCategory(){if(!editable())return;const name=prompt('輸入新分類名稱');if(name===null)return;const c=name.trim();if(!c)return;if(categories.has(c)){toast('此分類已存在',true);return}categories.add(c);filter=catKey(c);query='';$('search').value='';markDirty();refresh()}
function renameCategory(){if(!editable())return;const old=selectedCat();if(old==='未分類'||!categories.has(old))return;const input=prompt('修改分類名稱',old);if(input===null)return;const c=input.trim();if(!c||c===old)return;if(categories.has(c)){toast('此分類已存在',true);return}categories.delete(old);categories.add(c);for(const t of tracks.values())if(t.category===old)t.category=c;filter=catKey(c);markDirty();refresh()}
function deleteCategory(){if(!editable())return;const c=selectedCat();if(c==='未分類'||!categories.has(c))return;const list=[...tracks.values()].filter(t=>t.category===c);if(!confirm(`刪除「${c}」分類？${list.length?'其中 '+list.length+' 首音樂會移到「未分類」，不會刪除音樂。':''}`))return;for(const t of list)t.category='未分類';categories.delete(c);filter='all';markDirty();refresh()}
function disposeTrack(t){tracks.delete(t.key);stop(t);if(t.audio){t.audio.removeAttribute('src');t.audio.load();t.audio=null}if(t.file)URL.revokeObjectURL(t.url)}
function removeTrack(t){if(!editable()||!confirm('從音樂庫移除「'+t.name+'」？原始音樂檔案不會被刪除。'))return;disposeTrack(t);markDirty();refresh()}
function renameTrack(t){if(!editable())return;const n=prompt('修改音樂顯示名稱',t.name);if(n===null||!n.trim()||n.trim()===t.name)return;t.name=n.trim();t.ui.title.textContent=t.name;t.ui.title.title=t.name;t.ui.seek.setAttribute('aria-label',t.name+' 播放進度');updateTrack(t);markDirty();refresh()}
function moveTrack(t,c){if(!editable()||!categories.has(c)||t.category===c){if(t.ui)updateMove(t);return}t.category=c;markDirty();refresh();toast('已移至「'+c+'」')}
function chooseFiles(c){if(!editable())return;pickerTarget=c;$('files').click()}
function importFiles(files,folderMode,target=selectedCat()){if(!editable())return;const list=Array.from(files).filter(isAudio);if(!list.length){toast('找不到可辨識的音樂檔案，原音樂庫未變更。',true);return}let count=0;for(const f of list){const parts=(f.webkitRelativePath||f.name).split('/');const category=folderMode?(parts.length>2?parts.slice(1,-1).join('/'):'未分類'):target;const key='local:'+ ++serial;const url=URL.createObjectURL(f);addTrack({key,name:f.name,category,url,file:f,bytes:f.size});count++}markDirty();refresh();toast(`已加入 ${count} 首音樂 · ${size(totalBytes())}`)}
function bindDrop(node,category){const target=()=>typeof category==='function'?category():category;const valid=e=>editable()&&([...e.dataTransfer.types].includes('Files')||[...e.dataTransfer.types].includes('application/x-music-track'));node.addEventListener('dragover',e=>{if(!valid(e))return;e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect=e.dataTransfer.types.includes('Files')?'copy':'move';node.classList.add('dragover')});node.addEventListener('dragleave',e=>{if(!node.contains(e.relatedTarget))node.classList.remove('dragover')});node.addEventListener('drop',e=>{if(!valid(e))return;e.preventDefault();e.stopPropagation();node.classList.remove('dragover');if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files,false,target());else{const t=tracks.get(e.dataTransfer.getData('application/x-music-track'));if(t)moveTrack(t,target())}})}
function restore(){const data=initialData;initialData=null;if(!data){toast('音樂資料格式錯誤',true);return}if(Array.isArray(data.categories))for(const c of data.categories)if(typeof c==='string'&&c.trim())categories.add(c);const list=Array.isArray(data)?data:data.tracks;if(!Array.isArray(list))return;for(const [i,d] of list.entries()){if(!d||typeof d.name!=='string'||typeof d.category!=='string')continue;const path=safePath(d.path)?d.path:null,embedded=typeof d.data==='string'&&/^data:(?:audio\/[\w.+-]+|application\/octet-stream|video\/(?:mp4|webm));base64,[A-Za-z0-9+/=]+$/.test(d.data)?d.data:null;if(!embedded&&!path)continue;const encoded=embedded?embedded.slice(embedded.indexOf(',')+1):'';const bytes=embedded?Math.floor(encoded.length*3/4)-(encoded.endsWith('==')?2:encoded.endsWith('=')?1:0):0;addTrack({key:'restored:'+i,name:d.name,category:d.category,path,url:embedded||pathURL(path),embedded,bytes,loop:d.loop})}}
// SECTION 5 — export self-contained HTML. No arbitrary capacity limit; large files need more browser memory.
function jsonSafe(data){return JSON.stringify(data).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
function readData(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('音樂讀取失敗'));r.readAsDataURL(blob)})}
async function embedSave(){if(exporting)return;if(totalBytes()>100*1024*1024&&!confirm('音樂超過 100 MB，輸出的 HTML 將更大，可能需要較多記憶體。仍要儲存？'))return;exporting=true;const button=$('exportTop');button.disabled=true;const marker=/<script type="application\/json" id="library-data">[\s\S]*?<\/script>/;try{const match=marker.exec(TEMPLATE);if(!match)throw new Error('找不到存檔模板');const parts=[TEMPLATE.slice(0,match.index),'<script type="application/json" id="library-data">{"categories":',jsonSafe([...categories]),',"tracks":['];const list=sorted();for(const [i,t] of list.entries()){button.textContent=`儲存 ${i+1}/${list.length}`;let data=t.embedded;if(!data){let b=t.file;if(!b){const r=await fetch(t.url);if(!r.ok)throw new Error('無法讀取 '+t.name);b=await r.blob()}const type=b.type.split(';')[0];if(!/^(audio\/[\w.+-]+|video\/(mp4|webm)|application\/octet-stream)$/.test(type))b=new Blob([b],{type:'application/octet-stream'});data=await readData(b)}parts.push(i?',':'',jsonSafe({name:t.name,category:t.category,loop:t.loop,data}));}parts.push(']}<'+'/script>',TEMPLATE.slice(match.index+match[0].length));const blob=new Blob(parts,{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='music-library.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);markDirty(false);toast('已產生單檔 HTML · '+size(blob.size)+'。請確認瀏覽器已完成下載。')}catch(e){toast('儲存失敗：'+e.message,true)}finally{exporting=false;button.disabled=false;button.textContent='儲存 HTML'}}
// SECTION 6 — bind controls and initialize.
$('folderBtn').onclick=()=>{if(editable())$('folder').click()};$('filesBtn').onclick=$('dropAdd').onclick=()=>chooseFiles(selectedCat());$('folder').onchange=e=>{importFiles(e.target.files,true);e.target.value=''};$('files').onchange=e=>{importFiles(e.target.files,false,pickerTarget);e.target.value=''};$('newCat').onclick=newCategory;$('renameCat').onclick=renameCategory;$('deleteCat').onclick=deleteCategory;bindDrop($('dropzone'),selectedCat);document.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});$('editMode').onclick=()=>{editing=!editing;document.body.classList.toggle('edit-hidden',!editing);$('editMode').textContent=editing?'編輯模式':'播放模式';$('editMode').setAttribute('aria-pressed',String(editing))};window.addEventListener('beforeunload',e=>{if(dirty||exporting){e.preventDefault();e.returnValue=''}});$('search').oninput=e=>{query=e.target.value.trim().toLocaleLowerCase();renderContent()};$('volume').oninput=e=>{cancelFade();setMaster(Number(e.target.value)/100)};$('vol16').onclick=()=>{cancelFade();setMaster(.16)};$('vol100').onclick=()=>{cancelFade();setMaster(1)};$('fade16').onclick=()=>startFade(.16);$('fade100').onclick=()=>startFade(1);$('fadeStop').onclick=()=>startFade(0,true);$('stopAll').onclick=()=>stopAll();$('exportTop').onclick=embedSave;function theme(v){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀ 淺色':'☾ 深色';try{localStorage.setItem('music-theme',v)}catch{}}$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');try{theme(localStorage.getItem('music-theme')==='light'?'light':'dark')}catch{theme('dark')}if('ResizeObserver'in window)new ResizeObserver(()=>document.documentElement.style.setProperty('--dock',$('dock').offsetHeight+'px')).observe($('dock'));restore();refresh();markDirty(false);
